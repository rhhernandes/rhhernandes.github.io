# =============================================================================
# copy.toml — every piece of copy on the site, in one place.
#
# How to use:
#   1. Edit text here.
#   2. Run: python3 build_site.py
#   3. Commit and push.
#
# Rules:
#   - Text is inserted into the HTML as-is. Write & as &amp; and use plain
#     HTML for links: <a href="...">text</a> (external links also carry
#     target="_blank" rel="noopener").
#   - {email} and {year} are placeholders filled in at build time.
#   - List-based content (articles, talks, awards, press, testimonials,
#     teaching) is NOT here — it lives in articles.csv and data/*.json.
#
# Layout: one block per page (index, about, research, journalism, speaking,
# recognition, teaching, academic), then SHARED sections that appear on every
# page (header/nav, enquiries band, footer, card labels).
#
# Each page has:
#   [page.meta]    — browser-tab title + search/social description (SEO)
#   [page.header]  — the kicker (small label above the title), the page
#                    heading, and the intro paragraph(s)
#   ...then one block per section of the page.
# =============================================================================


# =============================================================================
# INDEX.HTML — home page
# =============================================================================

[index.meta]
title = "Raphael Hernandes · AI Ethics Researcher &amp; Journalist"
description = "AI ethics researcher at the University of Cambridge, after more than a decade as an award-winning journalist at Folha de S.Paulo and the Guardian. Research and reporting on how AI reshapes journalism and information environments."

# Structured data (JSON-LD) — not visible on the page; feeds Google search
# results and knowledge panels.
[index.schema]
job_titles = ["AI Ethics Researcher", "Data Journalist"]
works_for = "University of Cambridge"
affiliation = "University of Cambridge"
affiliation_department = "Cambridge Digital Humanities"
alumni_of = "University of Cambridge"
awards = [
    "European Press Prize Laureate, Innovation category (2026)",
    "Huw Price Prize, University of Cambridge",
    "Harding Distinguished Postgraduate Scholarship",
]
# One-sentence summary of who you are, for search engines (third person).
description = "Raphael Hernandes is a PhD candidate at Cambridge Digital Humanities, University of Cambridge, researching how AI reshapes journalism and information environments. He previously spent more than a decade as a journalist at Folha de S.Paulo and the Guardian."
# Subject expertise. Where a topic has a clear Wikipedia entry, the optional
# wikipedia key links it to that entity, which is a stronger signal than a bare
# string; topics without one are emitted as plain text.
knows_about = [
    { name = "AI ethics", wikipedia = "https://en.wikipedia.org/wiki/Ethics_of_artificial_intelligence" },
    { name = "AI and journalism" },
    { name = "Disinformation", wikipedia = "https://en.wikipedia.org/wiki/Disinformation" },
    { name = "Algorithm auditing" },
    { name = "Data journalism", wikipedia = "https://en.wikipedia.org/wiki/Data_journalism" },
    { name = "Platform accountability" },
]

# Hero — the big opening block with the portrait.
[index.hero]
kicker = "AI ethics researcher · Award-winning journalist"
heading = "Raphael Hernandes"
lede = '''Journalism and research on the systems that shape what people get to know.'''
summary = '''PhD candidate at Cambridge Digital Humanities, researching how AI impacts journalism, information environments, and mediation. The questions come from over a decade of reporting at places like Folha de S.Paulo and the Guardian.'''
button = "Speaking &amp; advisory enquiries"
text_link = "More about me"

# Credential strip — the three headline credentials under the hero.
[index.credentials]
aria_label = "Headline credentials"  # spoken by screen readers only

[[index.credentials.items]]
label = "European Press Prize"
detail = "Laureate — 2026 shortlist, Innovation category, for an investigation into far-right radicalisation on Facebook"

[[index.credentials.items]]
label = "Huw Price Prize"
detail = "Best overall performance, Cambridge MPhil in Ethics of AI, Data, and Algorithms"

[[index.credentials.items]]
label = "Harding Scholar"
detail = "Work funded by a Harding Distinguished Postgraduate Scholarship, University of Cambridge"

# Explore — the index of links to the other pages.
[index.explore]
heading_sr = "Explore"  # screen-reader-only section heading

[[index.explore.rows]]
title = "About"
href = "about.html"
desc = "The longer version: how reporting and research connect."
 
[[index.explore.rows]]
title = "Research"
href = "research.html"
desc = "Publications on AI, journalism, and information integrity."

[[index.explore.rows]]
title = "Journalism"
href = "journalism.html"
desc = "Selected reporting and investigations."

[[index.explore.rows]]
title = "Speaking &amp; public engagement"
href = "speaking.html"
desc = "Keynotes, panels, workshops, and training."

[[index.explore.rows]]
title = "Recognition &amp; press"
href = "recognition.html"
desc = "Awards, honours, and media coverage."


# =============================================================================
# ABOUT.HTML
# =============================================================================

[about.meta]
title = "About · Raphael Hernandes"
description = "Raphael Hernandes spent more than a decade reporting on — and building with — AI and data at Folha de S.Paulo and the Guardian. He is now a PhD candidate at Cambridge, researching AI, journalism, and information environments."

[about.header]
kicker = "About"
title = "A journalist at Cambridge"

[about.body]
paragraphs = [
    '''For over a decade I worked as a journalist. Before moving to the UK, I was an editor-at-large ("repórter especial") at <a href="https://www1.folha.uol.com.br/autores/raphael-hernandes.shtml" target="_blank" rel="noopener">Folha de S.Paulo</a>, Brazil's largest newspaper. I was later part of the data team at <a href="https://www.theguardian.com/profile/raphael-hernandes" target="_blank" rel="noopener">the Guardian</a>. I used data to break stories, and I built and implemented AI tools inside the newsroom: systems for investigation, analysis, and automation that changed how the reporting got done.''',
    '''The subject I kept returning to was the machinery reshaping how societies know things. I reported on algorithmic harm, disinformation, platform power, and cybersecurity. A Guardian investigation tracing <a href="https://www.theguardian.com/world/ng-interactive/2025/sep/28/inside-the-everyday-facebook-networks-where-far-right-ideas-grow" target="_blank" rel="noopener">far-right radicalisation across a network of UK Facebook groups</a> was named a 2026 European Press Prize Laureate, shortlisted in the Innovation category.''',
    '''I went to Cambridge to study those systems. I took the MPhil in Ethics of AI, Data, and Algorithms, graduating with Distinction and the <a href="https://www.lcfi.ac.uk/education/mphil/huw-price-prize" target="_blank" rel="noopener">Huw Price Prize</a> for the year's best overall performance. I am now a PhD candidate at <a href="https://www.cdh.cam.ac.uk/about/people/raphael-hernandes/" target="_blank" rel="noopener">Cambridge Digital Humanities</a> (Selwyn College), supported by a <a href="https://www.hardingscholars.fund.cam.ac.uk/raphael-hernandes-2025-cohort" target="_blank" rel="noopener">Harding Distinguished Postgraduate Scholarship</a>, researching how AI reshapes journalism, information environments, and mediation.''',
    '''The research maps directly onto the practice. I work on the questions I used to run into: <a href="https://www.mctd.ac.uk/report-launch-data-not-found/" target="_blank" rel="noopener">whether platforms let anyone independently check what circulates on them</a>, whether news organisations have any say in how AI systems use their content, how much AI-generated material is really out there, and <a href="https://www.desirableai.com/journalism-toolkit" target="_blank" rel="noopener">what responsible adoption actually looks like inside a newsroom</a>.''',
    '''Beyond the newsroom and the university, I founded Privacidade para Jornalistas, a cybersecurity resource and training project for journalists which ran until 2024. I also <a href="speaking.html">speak regularly</a> on AI, journalism, and information integrity. Venues include the Alan Turing Institute, the University of Oxford, Web Summit Rio, Abraji, and Pulitzer Center events.''',
]
# pull_quote — optional. Add a sentence here to show a pull quote at the end of
# the About body; leave it out (or empty) and nothing is rendered.
pull_quote = ""
photo_credit = "Raphael Hernandes at Selwyn College. <i>Photo: Lloyd Mann/University of Cambridge</i>"


# =============================================================================
# RESEARCH.HTML
# =============================================================================

[research.meta]
title = "Research · Raphael Hernandes"
description = "PhD research at Cambridge Digital Humanities on AI, journalism, information environments, and mediation. Publications on algorithm auditing, AI literacy, and news integrity."

[research.header]
kicker = "Research"
title = "How AI reshapes what societies know"
intro = [
    '''I am a PhD candidate at <a href="https://www.cdh.cam.ac.uk/about/people/raphael-hernandes/" target="_blank" rel="noopener">Cambridge Digital Humanities</a>, University of Cambridge (Selwyn College), supported by a <a href="https://www.hardingscholars.fund.cam.ac.uk/raphael-hernandes-2025-cohort" target="_blank" rel="noopener">Harding Distinguished Postgraduate Scholarship</a>. My research examines how artificial intelligence reshapes journalism and information environments, and what that means for mediation: the people, institutions, and systems that stand between events and public understanding.''',
    '''My work keeps technology platforms under scrutiny. That means both the information circulating on them and the ability of others to examine it.''',
    '''I am a Student Fellow at the <a href="https://www.lcfi.ac.uk/people/raphael-hernandes-2" target="_blank" rel="noopener">Leverhulme Centre for the Future of Intelligence</a>, and completed the MPhil in Ethics of AI, Data, and Algorithms at Cambridge with Distinction and the <a href="https://www.lcfi.ac.uk/education/mphil/huw-price-prize" target="_blank" rel="noopener">Huw Price Prize</a>. I combine computational approaches — algorithm audits, large-scale text analysis, computational grounded theory — with interviews and ethical analysis, informed by more than a decade in newsrooms.''',
]

[research.themes]
kicker = "Themes"
heading = "What I work on"

[[research.themes.topics]]
title = "AI and journalism"
desc = "How newsrooms adopt AI systems, what those systems do to editorial judgement and labour, and what responsible adoption looks like in practice."

[[research.themes.topics]]
title = "Information integrity"
desc = "How platforms and generative systems change what publics can reliably know."

[[research.themes.topics]]
title = "Mediation"
desc = "Who and what now stands between events and public understanding, as algorithmic systems take over work once done by human gatekeepers."

# Publications list itself comes from articles.csv (Category = Academic).
[research.publications]
kicker = "Publications"
heading = "Papers, reports &amp; research writing"
scholar_link = "Full list on Google Scholar"


